<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Doctrine Doctor CI feedback flow</title>
  <desc id="desc">A pull request is checked by Doctrine Doctor, findings are reported in the CI job, and the developer fixes the issue before merging.</desc>
  <rect width="1200" height="430" rx="24" fill="#f8fafc"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#0f172a">
    <text x="56" y="54" font-size="28" font-weight="700">Catch persistence problems before they reach main</text>
    <text x="56" y="82" font-size="16" fill="#475569">The CI command gives every pull request the same fast, actionable feedback.</text>

    <g transform="translate(56 132)">
      <rect width="230" height="190" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <circle cx="34" cy="38" r="18" fill="#dbeafe"/>
      <path d="M28 38h12M34 32v12" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
      <text x="24" y="84" font-size="20" font-weight="700">1. Open a PR</text>
      <text x="24" y="116" font-size="15" fill="#475569">Change an entity, query,</text>
      <text x="24" y="139" font-size="15" fill="#475569">mapping, or repository.</text>
      <text x="24" y="171" font-size="14" fill="#64748b">No special workflow needed.</text>
    </g>

    <path d="M306 228h74" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <path d="m368 216 16 12-16 12" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(400 132)">
      <rect width="230" height="190" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <circle cx="34" cy="38" r="18" fill="#ede9fe"/>
      <path d="M26 39h16M30 32v14M38 32v14" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/>
      <text x="24" y="84" font-size="20" font-weight="700">2. Analyze</text>
      <text x="24" y="116" font-size="15" fill="#475569">Run source, mapping, and</text>
      <text x="24" y="139" font-size="15" fill="#475569">configuration checks.</text>
      <text x="24" y="171" font-size="14" fill="#64748b">Database audits stay opt-in.</text>
    </g>

    <path d="M650 228h74" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <path d="m712 216 16 12-16 12" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(744 132)">
      <rect width="230" height="190" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <circle cx="34" cy="38" r="18" fill="#fee2e2"/>
      <path d="m28 32 12 12M40 32 28 44" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
      <text x="24" y="84" font-size="20" font-weight="700">3. See a finding</text>
      <text x="24" y="116" font-size="15" fill="#475569">The job names the analyzer,</text>
      <text x="24" y="139" font-size="15" fill="#475569">location, and next step.</text>
      <text x="24" y="171" font-size="14" fill="#64748b">The check can block the merge.</text>
    </g>

    <path d="M994 228h74" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <path d="m1056 216 16 12-16 12" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(1088 132)">
      <rect width="92" height="190" rx="16" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/>
      <circle cx="46" cy="38" r="18" fill="#bbf7d0"/>
      <path d="m37 38 7 7 12-14" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="15" y="89" font-size="18" font-weight="700">4.</text>
      <text x="15" y="116" font-size="18" font-weight="700">Fix and</text>
      <text x="15" y="143" font-size="18" font-weight="700">merge</text>
      <text x="15" y="171" font-size="13" fill="#166534">Safe to ship.</text>
    </g>

    <rect x="56" y="354" width="1024" height="42" rx="10" fill="#0f172a"/>
    <text x="78" y="381" font-size="16" fill="#e2e8f0" font-family="monospace">php bin/console doctrine:doctor:analyze --fail-on=warning</text>
  </g>
</svg>

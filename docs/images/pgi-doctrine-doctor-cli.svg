<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">Doctrine Doctor analysis of the PGI project</title>
  <desc id="desc">A terminal capture showing Doctrine Doctor running 50 analyzers against PGI and reporting 129 findings in 355 milliseconds.</desc>
  <rect width="1440" height="720" rx="18" fill="#0b1220"/>
  <rect width="1440" height="58" rx="18" fill="#172033"/>
  <rect y="40" width="1440" height="18" fill="#172033"/>
  <circle cx="30" cy="29" r="8" fill="#fb7185"/>
  <circle cx="56" cy="29" r="8" fill="#facc15"/>
  <circle cx="82" cy="29" r="8" fill="#4ade80"/>
  <text x="120" y="36" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="18">Doctrine Doctor CLI</text>
  <g font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="20">
    <text x="44" y="100" fill="#93c5fd">$</text>
    <text x="70" y="100" fill="#e2e8f0">php bin/console doctrine:doctor:analyze</text>
    <text x="70" y="124" fill="#94a3b8">--no-ansi --fail-on=never</text>
    <text x="44" y="142" fill="#c4b5fd">Doctrine Doctor static analysis</text>
    <text x="44" y="174" fill="#64748b">===============================</text>
    <text x="44" y="220" fill="#c4b5fd">Metric              Value</text>
    <text x="44" y="244" fill="#64748b">------------------  -----------</text>
    <text x="44" y="276" fill="#94a3b8">Analyzers           </text>
    <text x="280" y="276" fill="#f8fafc">50</text>
    <text x="44" y="308" fill="#94a3b8">Findings            </text>
    <text x="280" y="308" fill="#fbbf24">129</text>
    <text x="44" y="340" fill="#94a3b8">Duration            </text>
    <text x="280" y="340" fill="#4ade80">277.84 ms</text>
    <text x="500" y="276" fill="#fb7185">Critical 19</text>
    <text x="500" y="308" fill="#facc15">Warnings 56</text>
    <text x="500" y="340" fill="#60a5fa">Info 54</text>
    <text x="44" y="380" fill="#fb7185">Critical findings (19)</text>
    <text x="44" y="416" fill="#94a3b8">[configuration]</text>
    <text x="280" y="416" fill="#f8fafc">Missing Metadata Cache in Production Config</text>
    <text x="44" y="452" fill="#94a3b8">[integrity]</text>
    <text x="280" y="452" fill="#f8fafc">Float Used for Money: PgiOrder::$preTaxAmount</text>
    <text x="44" y="488" fill="#94a3b8">[integrity]</text>
    <text x="280" y="488" fill="#f8fafc">Type Mismatch: TimeEntry::$incorrectStatusReasons</text>
    <text x="44" y="534" fill="#facc15">Warnings (56)</text>
    <text x="44" y="570" fill="#94a3b8">[integrity]</text>
    <text x="280" y="570" fill="#f8fafc">Missing cascade on composition relationship</text>
    <text x="44" y="606" fill="#94a3b8">[security]</text>
    <text x="280" y="606" fill="#f8fafc">Overprivileged Database User: root</text>
    <text x="44" y="652" fill="#4ade80">✓ Analysis complete</text>
    <text x="310" y="652" fill="#94a3b8">source and mapping checks; database audit not requested</text>
  </g>
</svg>
